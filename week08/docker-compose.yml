version: "3.8"

services:
  postgres-dev:
    image: postgres:13
    container_name: books-postgres-dev
    environment:
      POSTGRES_DB: books_dev
      POSTGRES_USER: books_user
      POSTGRES_PASSWORD: booksbooks
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books_user -d books_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:13
    container_name: books-postgres-test
    environment:
      POSTGRES_DB: books_test
      POSTGRES_USER: books_user
      POSTGRES_PASSWORD: booksbooks
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books_user -d books_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  postgres_test_data:
